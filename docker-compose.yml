# =============================================================================
# krishna.shop — full local stack
#
#   docker compose up --build          # build all images + start everything
#   docker compose up -d --build       # detached
#   docker compose logs -f order-service
#   docker compose down                # stop (keep data)
#   docker compose down -v             # stop + wipe DB/Kafka volumes
#
# Handy endpoints once healthy:
#   API Gateway .......... http://localhost:8080
#   Eureka dashboard ..... http://localhost:8761
#   Config Server ........ http://localhost:8888/actuator/health
#   MailHog (emails) ..... http://localhost:8025
#   Zipkin (traces) ...... http://localhost:9411
# =============================================================================

# ---- reusable env fragments (YAML anchors) ---------------------------------
x-cluster-env: &cluster-env
  CONFIG_IMPORT: "configserver:http://config-server:8888"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka/"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"

x-depends-core: &depends-core
  config-server:
    condition: service_healthy
  service-discovery:
    condition: service_started

services:
  # ------------------------- infrastructure --------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: krishna
      POSTGRES_PASSWORD: krishna
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishna"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node combined broker+controller (no ZooKeeper).
      # Official apache/kafka image auto-formats storage on first boot.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single-node: everything replication factor 1, or internal topics fail to create.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  # ------------------------- platform core ---------------------------------
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: config-server
    environment:
      SPRING_PROFILES_ACTIVE: "native"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS: "file:/config-repo"
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8888'"]
      interval: 10s
      timeout: 5s
      retries: 15

  service-discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: service-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8761'"]
      interval: 10s
      timeout: 5s
      retries: 15

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    environment:
      <<: *cluster-env
      SPRING_DATA_REDIS_HOST: "redis"
    ports:
      - "8080:8080"
    depends_on:
      <<: *depends-core
      redis:
        condition: service_healthy

  # ------------------------- business services -----------------------------
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    environment:
      <<: *cluster-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db"
      SPRING_DATASOURCE_USERNAME: "krishna"
      SPRING_DATASOURCE_PASSWORD: "krishna"
    ports:
      - "8081:8081"
    depends_on:
      <<: *depends-core
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: product-service
    environment:
      <<: *cluster-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/product_db"
      SPRING_DATASOURCE_USERNAME: "krishna"
      SPRING_DATASOURCE_PASSWORD: "krishna"
      SPRING_DATA_REDIS_HOST: "redis"
    ports:
      - "8082:8082"
    depends_on:
      <<: *depends-core
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: cart-service
    environment:
      <<: *cluster-env
      SPRING_DATA_REDIS_HOST: "redis"
    ports:
      - "8083:8083"
    depends_on:
      <<: *depends-core
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-service
    environment:
      <<: *cluster-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "krishna"
      SPRING_DATASOURCE_PASSWORD: "krishna"
    ports:
      - "8084:8084"
    depends_on:
      <<: *depends-core
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-service
    environment:
      <<: *cluster-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "krishna"
      SPRING_DATASOURCE_PASSWORD: "krishna"
    ports:
      - "8085:8085"
    depends_on:
      <<: *depends-core
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: inventory-service
    environment:
      <<: *cluster-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/inventory_db"
      SPRING_DATASOURCE_USERNAME: "krishna"
      SPRING_DATASOURCE_PASSWORD: "krishna"
    ports:
      - "8086:8086"
    depends_on:
      <<: *depends-core
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    environment:
      <<: *cluster-env
      SPRING_MAIL_HOST: "mailhog"
      SPRING_MAIL_PORT: "1025"
    ports:
      - "8087:8087"
    depends_on:
      <<: *depends-core
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
