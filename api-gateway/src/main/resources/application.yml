spring:
  application:
    name: api-gateway
  config:
    # Fetch the rest of the configuration (routes, redis, security) from config-server.
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5

# Local fallbacks so the gateway still boots if config-server is unavailable.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
