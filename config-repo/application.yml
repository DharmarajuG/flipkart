# ============================================================================
# Shared configuration applied to ALL services (Spring Cloud Config "application")
# Per-service files override/extend these values.
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness & /readiness for k8s
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  prometheus:
    metrics:
      export:
        enabled: true

management.zipkin.tracing.endpoint: ${ZIPKIN_URI:http://localhost:9411/api/v2/spans}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "shop.krishna.common.event"
        isolation.level: read_committed

# Shared JWT settings; the secret MUST be overridden via env/Secrets Manager in prod.
security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-key-32b+}
    issuer: krishna.shop
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000

logging:
  pattern:
    # Include traceId/spanId so Kibana can correlate logs with traces.
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
