server:
  port: 8085

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:krishna}
    password: ${DB_PASSWORD:krishna}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: payment-service

# Mock PSP behaviour (deterministic for demos/tests).
payment:
  gateway:
    mode: MOCK           # MOCK | STRIPE (stub)
    approve-probability: 0.9

springdoc:
  swagger-ui:
    path: /swagger-ui.html
