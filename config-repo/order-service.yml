server:
  port: 8084

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:krishna}
    password: ${DB_PASSWORD:krishna}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: order-service

# Downstream services (resolved via Eureka service ids).
clients:
  cart-service-url: http://cart-service
  product-service-url: http://product-service

resilience4j:
  circuitbreaker:
    instances:
      cartClient:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
